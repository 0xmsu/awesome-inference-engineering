# Mobile & Embedded Runtimes
- id: executorch
  name: ExecuTorch
  url: https://github.com/pytorch/executorch
  description: PyTorch's on-device runtime that exports models ahead of time and runs them on phones, wearables, and microcontrollers through pluggable hardware backends.
  section: edge/mobile
  type: library
  tags: [llm, mobile, embedded, cpp, python]
  license: BSD-3-Clause
  featured: true
  added: 2026-10-27

- id: litert-lm
  name: LiteRT-LM
  url: https://github.com/google-ai-edge/LiteRT-LM
  description: LLM orchestration layer on top of LiteRT for Android, iOS, web, desktop, and IoT, with GPU and NPU paths and multi-token prediction for Gemma 4.
  section: edge/mobile
  type: library
  tags: [llm, vlm, mobile, npu, cpp, python]
  verified: 2026-10-27
  added: 2026-10-27

- id: litert
  name: LiteRT
  url: https://github.com/google-ai-edge/LiteRT
  description: Runtime that succeeds TensorFlow Lite, converting models and running them on phones and edge devices through CPU, GPU, and NPU accelerators.
  section: edge/mobile
  type: library
  tags: [mobile, embedded, npu, cpp]
  added: 2026-10-27

- id: mediapipe-llm-inference
  name: MediaPipe LLM Inference API
  url: https://developers.google.com/edge/mediapipe/solutions/genai/llm_inference
  description: MediaPipe task for running LLMs in Android, iOS, and web apps, now marked maintenance-only by Google, which recommends LiteRT-LM for new projects.
  section: edge/mobile
  type: library
  tags: [llm, mobile, browser]
  repo: google-ai-edge/mediapipe
  license: Apache-2.0
  status: maintenance
  successor: litert-lm
  verified: 2026-10-27
  added: 2026-10-27

- id: mnn
  name: MNN
  url: https://github.com/alibaba/MNN
  description: Lightweight C++ inference engine from Alibaba for mobile and embedded devices, including an LLM module for running chat models on Android and iOS.
  section: edge/mobile
