- id: inference-perf
  name: Inference Perf
  url: https://github.com/kubernetes-sigs/inference-perf
  description: Server-agnostic load generator from Kubernetes WG Serving with goodput, multi-stage rate sweeps, and Azure or OpenTelemetry trace replay.
