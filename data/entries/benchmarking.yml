# --- Metrics & Methodology ---

- id: roofline-model
  name: "Roofline: An Insightful Visual Performance Model for Multicore Architectures"
  url: https://dl.acm.org/doi/10.1145/1498765.1498785
  description: Bounds attainable performance by arithmetic intensity, peak compute, and memory bandwidth; the usual lens for compute-bound prefill and memory-bound decode.
  section: benchmarking/methodology
  type: paper
  paper:
    venue: Communications of the ACM
    year: 2009
  via: [wafer-ai]
  featured: true
  added: 2026-10-27

- id: mlperf-inference-paper
  name: MLPerf Inference Benchmark
  url: https://arxiv.org/abs/1911.02549
  description: Defines the LoadGen scenarios, latency bounds, and accuracy targets behind MLPerf Inference and explains how they keep results comparable.
  section: benchmarking/methodology
  type: paper
  paper:
    venue: ISCA
    year: 2020
    code: https://github.com/mlcommons/inference
  via: [wafer-ai]
  added: 2026-10-27

- id: cutlass-gemm-measurement
  name: CUTLASS GEMM Performance Measurement Methodology
  url: https://docs.nvidia.com/cutlass/latest/media/docs/cpp/gemm_performance_measurement_methodology_guidelines.html
  description: NVIDIA guidance on separate warmup loops, buffer rotation for cold caches, fixed-clock versus fixed-power runs, and input entropy for reproducible GEMM numbers.
  section: benchmarking/methodology
  type: docs
  tags: [nvidia, cuda]
  via: [wafer-ai]
  added: 2026-10-27

- id: etalon
  name: "Etalon: Holistic Performance Evaluation Framework for LLM Inference Systems"
  url: https://arxiv.org/abs/2407.07000
  description: Argues that TTFT and TBT averages hide streaming stalls and proposes fluidity-index, a deadline-based metric, with a harness for measuring it.
  section: benchmarking/methodology
  type: paper
  tags: [llm]
  paper:
    venue: arXiv
    year: 2024
    code: https://github.com/project-etalon/etalon
  via: [wafer-ai]
  added: 2026-10-27

- id: fregly-performance-checklist
  name: AI Systems Performance Checklist
  url: https://github.com/cfregly/ai-performance-engineering/blob/main/docs/appendix.md
  description: Over 200 tuning and measurement items from Fregly's O'Reilly book, from steady-state timing and OS and CUDA settings up to cluster-scale cost controls.
  section: benchmarking/methodology
