# Benchmarking & Capacity Planning: load generators, suites, traces, simulators, and methodology.

# --- Benchmark Tools ---

- id: aiperf
  name: AIPerf
  url: https://github.com/ai-dynamo/aiperf
  description: Load generator for OpenAI-compatible servers with concurrency, request-rate, and trace-replay modes plus goodput; replaces Triton's GenAI-Perf.
  section: benchmarking/tools
  type: tool
  tags: [llm, python]
  featured: true
  added: 2026-10-27

- id: guidellm
  name: GuideLLM
  url: https://github.com/vllm-project/guidellm
  description: SLO-oriented load tester that sweeps synchronous, concurrent, and rate-based traffic and reports full TTFT and inter-token latency distributions.
  section: benchmarking/tools
  type: tool
  tags: [llm, python]
  added: 2026-10-27

- id: vllm-bench-cli
  name: vLLM Benchmark CLI
  url: https://docs.vllm.ai/en/latest/benchmarking/cli/
  description: Usage guide for vllm bench serve and throughput, which drive online or offline load from ShareGPT, BurstGPT, random, multimodal, or custom datasets.
  section: benchmarking/tools
  type: docs
  tags: [llm, python]
  repo: vllm-project/vllm
  added: 2026-10-27

- id: genai-bench
  name: genai-bench
  url: https://github.com/sgl-project/genai-bench
  description: Token-level serving benchmark from the SGLang project with a live progress dashboard, traffic-scenario sweeps, and Excel and plot reports.
  section: benchmarking/tools
