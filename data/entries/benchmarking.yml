# --- Simulators & Capacity Planners ---

- id: aisimulate
  name: AISimulate
  url: https://github.com/ai-dynamo/aisimulate
  description: Predicts serving latency and throughput from measured operator data and searches aggregated and disaggregated configs offline; succeeds AIConfigurator.
  section: benchmarking/simulators
  type: tool
  tags: [llm, nvidia, python]
  license: Apache-2.0
  verified: 2026-10-27
  added: 2026-10-27

- id: aiconfigurator
  name: AIConfigurator
  url: https://github.com/ai-dynamo/aiconfigurator
  description: NVIDIA configuration search for disaggregated Dynamo and llm-d deployments; accepts only fixes while its estimator moves to AISimulate.
  section: benchmarking/simulators
  type: tool
  tags: [llm, nvidia, python]
  status: maintenance
  successor: aisimulate
  verified: 2026-10-27
  added: 2026-10-27

- id: llm-engineers-almanac
  name: LLM Engineer's Almanac
  url: https://modal.com/llm-almanac/advisor
  description: Benchmark-backed advisor that ranks vLLM, SGLang, and TensorRT-LLM setups by latency target and cost per token, with guides on benchmarking and quantization.
