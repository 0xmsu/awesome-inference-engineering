# Deep dives
- id: siboehm-cuda-matmul
  name: How to Optimize a CUDA Matmul Kernel for cuBLAS-like Performance
  url: https://siboehm.com/articles/22/CUDA-MMM
  description: Worklog that takes a naive SGEMM through coalescing, shared-memory tiling, and warptiling, profiling each step against cuBLAS.
  section: learning/deep-dives
  type: article
  tags: [nvidia, cuda]
  via: [wafer-ai]
  featured: true
  added: 2026-10-27

- id: gordic-matmul
  name: "Inside NVIDIA GPUs: Anatomy of High-Performance Matmul Kernels"
  url: https://www.aleksagordic.com/blog/matmul
  description: Builds from GPU memory hierarchy and PTX/SASS up to Hopper matmul kernels that use TMA, wgmma, and warp specialization.
  section: learning/deep-dives
  type: article
  tags: [nvidia, cuda]
  via: [wafer-ai]
  added: 2026-10-27

- id: outperforming-cublas-h100
  name: "Outperforming cuBLAS on H100: A Worklog"
  url: https://cudaforfun.substack.com/p/outperforming-cublas-on-h100-a-worklog
  description: Hopper follow-up to the Boehm worklog that grows a dependency-free GEMM in one CUDA file, adding TMA, wgmma, and warp specialization step by step.
  section: learning/deep-dives
  type: article
  tags: [nvidia, cuda]
  via: [wafer-ai]
  added: 2026-10-27

- id: tcgen05-for-dummies
  name: tcgen05 for dummies
  url: https://gau-nernst.github.io/tcgen05/
  description: Plain CUDA C++ and PTX walkthrough of Blackwell's tcgen05 Tensor Core instructions, building a B200 matmul that approaches cuBLAS.
  section: learning/deep-dives
  type: article
  tags: [nvidia, cuda]
  via: [wafer-ai]
  added: 2026-10-27

- id: colfax-tma-tutorial
  name: "CUTLASS Tutorial: Mastering the Tensor Memory Accelerator (TMA)"
  url: https://research.colfax-intl.com/tutorial-hopper-tma/
  description: Explains Hopper's TMA unit for asynchronous bulk copies, including loads, stores, and multicast, and how to drive it through CuTe.
  section: learning/deep-dives
  type: article
  tags: [nvidia, cuda, cpp]
  via: [wafer-ai]
  added: 2026-10-27

- id: colfax-wgmma-tutorial
  name: "CUTLASS Tutorial: Fast Matrix Multiplication with WGMMA on Hopper"
  url: https://research.colfax-intl.com/cutlass-tutorial-wgmma-hopper/
  description: Shows how warpgroup-level wgmma instructions work on Hopper and how CUTLASS and CuTe expose them in a GEMM mainloop.
  section: learning/deep-dives
  type: article
  tags: [nvidia, cuda, cpp]
  added: 2026-10-27

- id: cutlass-ping-pong-gemm
  name: Deep Dive on CUTLASS Ping-Pong GEMM Kernel
  url: https://pytorch.org/blog/cutlass-ping-pong-gemm-kernel/
  description: Walks through a warp-specialized Hopper FP8 GEMM in which producer and consumer warpgroups alternate so math overlaps with epilogues.
  section: learning/deep-dives
  type: article
  tags: [nvidia, cuda]
  added: 2026-10-27

- id: gpus-go-brrr
  name: GPUs Go Brrr
  url: https://hazyresearch.stanford.edu/blog/2024-05-12-tk
  description: Hazy Research essay on what keeps an H100 busy, from tensor cores and TMA to async pipelines, and the ThunderKittens design built on it.
  section: learning/deep-dives
  type: article
  tags: [nvidia, cuda]
  added: 2026-10-27

- id: optimizing-parallel-reduction
  name: Optimizing Parallel Reduction in CUDA
  url: https://developer.download.nvidia.com/assets/cuda/files/reduction.pdf
  description: Classic NVIDIA slide deck that refines a sum-reduction kernel through seven versions, a template for reasoning about bandwidth limits.
  section: learning/deep-dives
  type: article
  tags: [nvidia, cuda]
  via: [wafer-ai]
  added: 2026-10-27

- id: lilian-weng-inference-optimization
  name: Large Transformer Model Inference Optimization
  url: https://lilianweng.github.io/posts/2023-01-10-inference-optimization/
  description: Survey essay on distillation, quantization, pruning, sparsity, mixture of experts, and architecture changes that cut inference cost.
  section: learning/deep-dives
  type: article
  tags: [llm]
  featured: true
  added: 2026-10-27

- id: databricks-llm-inference-performance
  name: "LLM Inference Performance Engineering: Best Practices"
  url: https://www.databricks.com/blog/llm-inference-performance-engineering-best-practices
  description: Defines latency, throughput, and model bandwidth utilization, then measures how batch size, tensor parallelism, and quantization trade off.
  section: learning/deep-dives
  type: article
  tags: [llm, nvidia]
  added: 2026-10-27

- id: llm-inference-speed-of-light
  name: LLM Inference Speed of Light
  url: https://zeux.io/2024/03/15/llm-inference-sol/
  description: Derives the memory-bandwidth floor on per-token decode latency and checks how close a hand-written inference engine gets to it.
  section: learning/deep-dives
  type: article
  tags: [llm]
  added: 2026-10-27

- id: anyscale-continuous-batching
  name: How Continuous Batching Enables 23x Throughput in LLM Inference
  url: https://www.anyscale.com/blog/continuous-batching-llm-inference
  description: Explains why static batching wastes GPU time during decoding and benchmarks iteration-level scheduling across serving frameworks.
  section: learning/deep-dives
  type: article
  tags: [llm]
  added: 2026-10-27

- id: hf-continuous-batching
  name: Continuous Batching from First Principles
  url: https://huggingface.co/blog/continuous_batching
  description: Derives continuous batching step by step from attention and the KV cache, covering ragged batches and chunked prefill along the way.
  section: learning/deep-dives
  type: article
  tags: [llm, python]
  added: 2026-10-27

- id: flash-decoding
  name: Flash-Decoding for Long-Context Inference
  url: https://crfm.stanford.edu/2023/10/12/flashdecoding.html
  description: Introduces splitting the KV sequence across thread blocks during decode and merging partial softmax results so small batches still fill the GPU.
  section: learning/deep-dives
  type: article
  tags: [llm, nvidia]
  added: 2026-10-27

- id: pytorch-gpt-fast
  name: "Accelerating Generative AI with PyTorch II: GPT, Fast"
  url: https://pytorch.org/blog/accelerating-generative-ai-2/
  description: Shows how far plain PyTorch goes for LLM decoding with torch.compile, int8 and int4 weights, speculative decoding, and tensor parallelism.
  section: learning/deep-dives
  type: article
  tags: [llm, python]
  added: 2026-10-27

- id: fast-llm-inference-from-scratch
  name: Fast LLM Inference From Scratch
  url: https://andrewkchan.dev/posts/yalm.html
  description: Builds a single-GPU inference engine in C++ and CUDA without libraries, profiling each step from a naive CPU loop to fused kernels.
  section: learning/deep-dives
  type: article
  tags: [llm, cuda, cpp]
  added: 2026-10-27

- id: vllm-v1-architecture
  name: "vLLM V1: A Major Upgrade to vLLM's Core Architecture"
  url: https://vllm.ai/blog/2025-01-27-v1-alpha-release
  description: Design notes on vLLM's rewritten core, covering the unified scheduler, a separate engine-core process, prefix caching, and piecewise CUDA graphs.
  section: learning/deep-dives
  type: article
  tags: [llm]
  added: 2026-10-27

- id: character-ai-inference
  name: Optimizing AI Inference at Character.AI
  url: https://blog.character.ai/optimizing-ai-inference-at-character-ai/
  description: Shows how multi-query attention, hybrid local-global layers, cross-layer KV sharing, and int8 shrink KV memory for long conversations.
  section: learning/deep-dives
  type: article
  tags: [llm]
  added: 2026-10-27

- id: deepseek-inference-system-overview
  name: DeepSeek-V3/R1 Inference System Overview
  url: https://github.com/deepseek-ai/open-infra-index/blob/main/202502OpenSourceWeek/day_6_one_more_thing_deepseekV3R1_inference_system_overview.md
  description: First-hand account of serving V3/R1 with cross-node expert parallelism, a prefill-decode split, compute-communication overlap, and load balancing.
  section: learning/deep-dives
  type: article
  tags: [llm, moe, nvidia]
  repo: deepseek-ai/open-infra-index
  added: 2026-10-27

- id: sglang-large-scale-ep
  name: Deploying DeepSeek with PD Disaggregation and Large-Scale Expert Parallelism
  url: https://www.lmsys.org/blog/2025-05-05-large-scale-ep/
  description: Reproduces DeepSeek-style serving in SGLang on 96 H100s by combining prefill-decode disaggregation, DeepEP, two-batch overlap, and EPLB.
  section: learning/deep-dives
  type: article
  tags: [llm, moe, nvidia]
  added: 2026-10-27

