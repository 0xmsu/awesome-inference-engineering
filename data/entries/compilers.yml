# --- compilers/pytorch ---

- id: torch-compile
  name: torch.compile
  url: https://docs.pytorch.org/docs/stable/torch.compiler.html
  description: PyTorch's JIT compiler entry point, where TorchDynamo captures Python bytecode into FX graphs and TorchInductor emits Triton or C++.
  section: compilers/pytorch
  type: docs
  tags: [nvidia, amd, cpu, python]
  featured: true
  added: 2026-10-27

- id: pytorch-2-paper
  name: "PyTorch 2: Dynamic Python Bytecode Transformation and Graph Compilation"
  url: https://dl.acm.org/doi/10.1145/3620665.3640366
  description: Design paper for TorchDynamo and TorchInductor, covering guarded graph capture and the code generation behind torch.compile.
  section: compilers/pytorch
  type: paper
  tags: [python]
  paper: { venue: ASPLOS, year: 2024, code: https://github.com/pytorch/pytorch }
  added: 2026-10-27

- id: torch-export
  name: torch.export
  url: https://docs.pytorch.org/docs/stable/export.html
  description: Ahead-of-time capture of a PyTorch program into one sound graph with symbolic shapes, the input format for AOTInductor and other backends.
  section: compilers/pytorch
  type: docs
  tags: [python]
  added: 2026-10-27

- id: aotinductor
  name: AOTInductor
  url: https://docs.pytorch.org/docs/stable/torch.compiler_aot_inductor.html
  description: Compiles exported PyTorch programs into a shared library and package that load and run from C++ or Python without recompiling.
  section: compilers/pytorch
  type: docs
  tags: [nvidia, cpu, cpp, python]
  added: 2026-10-27

- id: torch-tensorrt
  name: Torch-TensorRT
  url: https://github.com/pytorch/TensorRT
  description: Compiler backend that lowers torch.compile or torch.export graphs to TensorRT engines and falls back to PyTorch for unsupported ops.
  section: compilers/pytorch
  type: tool
  tags: [nvidia, python, cpp]
  added: 2026-10-27

- id: lightning-thunder
  name: Lightning Thunder
  url: https://github.com/Lightning-AI/lightning-thunder
  description: Source-to-source PyTorch compiler that traces programs and hands regions to executors such as nvFuser, cuDNN, and torch.compile.
  section: compilers/pytorch
  type: tool
  tags: [nvidia, python]
  added: 2026-10-27

