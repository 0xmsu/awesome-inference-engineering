  section: compilers/open-compilers
  type: tool
  tags: [tpu, nvidia, amd, cpu, cpp]
  featured: true
  added: 2026-10-27

- id: apache-tvm
  name: Apache TVM
  url: https://github.com/apache/tvm
  description: Python-first ML compilation framework with the Relax graph IR and a tensor-level IR, used underneath MLC LLM and WebLLM.
  section: compilers/open-compilers
  type: tool
  tags: [nvidia, amd, apple, cpu, webgpu, python, cpp]
  added: 2026-10-27

- id: iree
  name: IREE
  url: https://github.com/iree-org/iree
  description: MLIR-based compiler and runtime that lowers models to one IR and deploys them from datacenter GPUs down to mobile and edge devices.
  section: compilers/open-compilers
  type: tool
