# Observability & Operations: profiling, telemetry, correctness, cost and energy, and security.

# --- Profiling & Debugging ---

- id: nsight-systems
  name: Nsight Systems
  url: https://docs.nvidia.com/nsight-systems/UserGuide/
  description: System-wide timeline profiler that lines up CPU threads, OS runtime, CUDA API calls, kernels, memory copies, and NVTX ranges to expose idle GPU time.
  section: observability/profiling
  type: tool
  tags: [nvidia, cuda]
  via: [wafer-ai]
  featured: true
  added: 2026-10-27

- id: nsight-compute
  name: Nsight Compute
  url: https://docs.nvidia.com/nsight-compute/ProfilingGuide/
  description: Kernel profiler that reads hardware counters to report roofline position, memory-hierarchy throughput, occupancy, and warp stall reasons per CUDA kernel.
  section: observability/profiling
  type: tool
  tags: [nvidia, cuda]
  via: [wafer-ai]
  added: 2026-10-27

- id: compute-sanitizer
  name: Compute Sanitizer
  url: https://docs.nvidia.com/compute-sanitizer/ComputeSanitizer/
  description: CUDA toolkit checkers (memcheck, racecheck, initcheck, synccheck) that catch out-of-bounds accesses, shared-memory races, and synchronization misuse.
  section: observability/profiling
  type: tool
  tags: [nvidia, cuda]
  via: [wafer-ai]
  added: 2026-10-27

- id: pytorch-profiler
  name: PyTorch Profiler
  url: https://docs.pytorch.org/docs/stable/profiler.html
  description: Captures operator, GPU kernel, and memory events from PyTorch programs and exports Chrome-format traces for viewing in Perfetto or analysis with HTA.
  section: observability/profiling
  type: tool
  tags: [python, nvidia, amd]
  added: 2026-10-27

- id: holistic-trace-analysis
  name: Holistic Trace Analysis
  url: https://github.com/facebookresearch/HolisticTraceAnalysis
  description: Analyzes PyTorch profiler traces across ranks, splitting GPU time into compute, communication, and idle, with overlap and critical-path reports.
  section: observability/profiling
  type: tool
  tags: [python]
  added: 2026-10-27

- id: perfetto
  name: Perfetto
  url: https://github.com/google/perfetto
  description: Browser-based trace viewer with a SQL trace processor, used to inspect PyTorch, Chrome-format, and Linux system traces without uploading them.
  section: observability/profiling
  type: tool
