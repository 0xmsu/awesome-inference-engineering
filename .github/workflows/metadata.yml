name: Metadata

on:
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh GitHub metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch metadata and fix renamed repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/enrich.ts --fix-urls --report "$RUNNER_TEMP/metadata-report.md"
      - run: pnpm build:readme
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: bot/metadata
          commit-message: "chore: refresh GitHub metadata"
          title: "chore: refresh GitHub metadata"
          body-path: ${{ runner.temp }}/metadata-report.md
          labels: automated, metadata
          add-paths: |
            data/
            README.md
