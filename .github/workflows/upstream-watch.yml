name: Upstream watch

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: Report new links in upstream lists
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Links found in the lists from data/sources.yml that are not in data/ yet."
            echo "These are candidates only: check each against CONTRIBUTING.md, write descriptions in our own words, and credit the source with \`via\`."
            echo
            node scripts/extract-links.ts --watched --new-only
          } > "$RUNNER_TEMP/upstream.md"
      - name: Find open report
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label upstream-candidates --state open --json number --jq '.[0].number // empty')" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Upstream candidates
          content-filepath: ${{ runner.temp }}/upstream.md
          issue-number: ${{ steps.existing.outputs.number }}
          labels: upstream-candidates, automated
