name: Links

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check all links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/changed-urls.ts --all > urls.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress urls.txt README.md CONTRIBUTING.md
          output: lychee/out.md
          fail: false
      - name: Find open report
        if: steps.lychee.outputs.exit_code != 0
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label links --state open --json number --jq '.[0].number // empty')" >> "$GITHUB_OUTPUT"
      - name: Open or update the link report
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Link report
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.existing.outputs.number }}
          labels: links, automated
